<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FormaHub 2.0{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
</head>
<body>
  <header class="topo">
    <div class="container">
      <a class="marca" href="/">
        {# Espaço do logotipo: trocar o símbolo provisório por <img class="marca-logo" src="..." alt=""> #}
        <span class="marca-simbolo" aria-hidden="true">F</span>
        <span>FormaHub 2.0</span>
      </a>
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
