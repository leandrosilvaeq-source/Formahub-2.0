<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FormaHub 2.0{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
</head>
<body>
  {# Definições reutilizáveis dos elementos gráficos (SVG próprio, sem imagens externas). #}
  <svg class="svg-defs" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="grad-cubo" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" class="s-coral"/>
        <stop offset="1" class="s-rosa"/>
      </linearGradient>
      <linearGradient id="grad-onda" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0" spreadMethod="repeat">
        <stop offset="0" class="s-ciano"/>
        <stop offset="0.5" class="s-rosa"/>
        <stop offset="0.8" class="s-coral"/>
        <stop offset="1" class="s-ciano"/>
      </linearGradient>
      <symbol id="deco-cubo" viewBox="0 0 64 64">
        <path class="cubo-traco" d="M32 4 58 19v30L32 60 6 49V19Z M6 19l26 15 26-15 M32 34v26"/>
      </symbol>
    </defs>
  </svg>

  <div class="deco-fundo" aria-hidden="true">
    <svg class="deco-cubo deco-cubo-a"><use href="#deco-cubo"/></svg>
    <span class="deco-pontos deco-pontos-a"></span>
    <svg class="deco-cubo deco-cubo-b"><use href="#deco-cubo"/></svg>
    <span class="deco-pontos deco-pontos-b"></span>
  </div>

  <header class="topo">
    <div class="container topo-conteudo">
      <a class="marca" href="/">
        <img class="marca-logo" src="{{ url_for('static', path='img/logo-forma3d-horizontal.png') }}"
          alt="Forma 3D Studio" width="1672" height="941">
      </a>
      <svg class="topo-particulas" viewBox="0 0 320 84" preserveAspectRatio="xMaxYMid meet" aria-hidden="true" focusable="false">
      <circle class="p-c" cx="310" cy="46" r="2.6" opacity="0.95"/>
      <circle class="p-r" cx="304" cy="39" r="2.6" opacity="0.93"/>
      <circle class="p-o" cx="298" cy="38" r="2.4" opacity="0.91"/>
      <circle cx="294" cy="45" r="2.3" opacity="0.91"/>
      <circle class="p-c" cx="280" cy="46" r="2.5" opacity="0.87"/>
      <circle class="p-r" cx="267" cy="44" r="2.2" opacity="0.87"/>
      <circle class="p-o" cx="261" cy="35" r="2.4" opacity="0.85"/>
      <circle cx="257" cy="44" r="2.4" opacity="0.83"/>
      <circle class="p-c" cx="245" cy="43" r="2.1" opacity="0.81"/>
      <circle class="p-r" cx="234" cy="54" r="2.3" opacity="0.78"/>
      <circle class="p-o" cx="222" cy="39" r="1.9" opacity="0.77"/>
      <circle cx="210" cy="56" r="2.0" opacity="0.75"/>
      <circle class="p-c" cx="203" cy="30" r="1.9" opacity="0.72"/>
      <circle class="p-r" cx="189" cy="63" r="1.9" opacity="0.7"/>
      <circle class="p-o" cx="190" cy="56" r="1.8" opacity="0.7"/>
      <circle cx="176" cy="64" r="2.0" opacity="0.68"/>
      <circle class="p-c" cx="164" cy="31" r="1.6" opacity="0.66"/>
      <circle class="p-r" cx="146" cy="50" r="1.7" opacity="0.62"/>
      <circle class="p-o" cx="148" cy="31" r="1.8" opacity="0.61"/>
      <circle cx="135" cy="35" r="1.5" opacity="0.59"/>
      <circle class="p-c" cx="120" cy="39" r="1.7" opacity="0.55"/>
      <circle class="p-r" cx="112" cy="67" r="1.6" opacity="0.55"/>
      <circle class="p-o" cx="110" cy="34" r="1.3" opacity="0.53"/>
      <circle cx="83" cy="38" r="1.1" opacity="0.49"/>
      <circle class="p-c" cx="83" cy="35" r="1.4" opacity="0.48"/>
      <circle class="p-r" cx="67" cy="78" r="1.2" opacity="0.46"/>
      <circle class="p-o" cx="59" cy="31" r="1.0" opacity="0.43"/>
      <circle cx="43" cy="34" r="0.9" opacity="0.4"/>
      <circle class="p-c" cx="36" cy="31" r="1.3" opacity="0.38"/>
      <circle class="p-r" cx="19" cy="46" r="0.8" opacity="0.35"/>
      </svg>
      <span class="topo-produto">FormaHub 2.0</span>
    </div>
    <div class="topo-onda" aria-hidden="true">
      <svg viewBox="0 0 2400 24" preserveAspectRatio="none" focusable="false">
        <path d="M0 12C200 0 400 0 600 12S1000 24 1200 12C1400 0 1600 0 1800 12S2200 24 2400 12"/>
      </svg>
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
